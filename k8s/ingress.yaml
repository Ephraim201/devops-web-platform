apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-web-platform
spec:
  ingressClassName: nginx
  rules:
    - host: devops-web-platform.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-web-platform
                port:
                  number: 5000