mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.160.0

command:
  name: otelcol-contrib

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch: {}

  exporters:
    otlp/jaeger:
      endpoint: jaeger.observability.svc.cluster.local:4317
      tls:
        insecure: true

    debug:
      verbosity: basic

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/jaeger, debug]

      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [debug]

      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [debug]