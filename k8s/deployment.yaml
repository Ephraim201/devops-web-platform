apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-web-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-web-platform
  template:
    metadata:
      labels:
        app: devops-web-platform
    spec:
      containers:
        - name: web
          image: zelgius/devops-web-platform:1.1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: devops-web-platform-config
                  key: APP_MESSAGE

            - name: APP_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: devops-web-platform-secret
                  key: APP_SECRET_KEY