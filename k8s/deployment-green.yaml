
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-web-platform-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-web-platform
      version: green
  template:
    metadata:
      labels:
        app: devops-web-platform
        version: green
    spec:
      containers:
        - name: web
          image: devops-web-platform:1.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: APP_MESSAGE
              value: "GREEN - DevOps Web Platform version 1.3"

            - name: APP_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: devops-web-platform-secret
                  key: APP_SECRET_KEY

            - name: OTEL_SERVICE_NAME
              value: "devops-web-platform"

            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://opentelemetry-collector.observability.svc.cluster.local:4318/v1/traces"
